logging:
  level:
    root: INFO
    com.course: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

cors:
  allowed-origins: http://localhost:8080,http://localhost:8081

user:
  maxFriends: 500
  maxBanUsers: 500
  enableProfilePicture: false
  minLenUser: 5
  minLenPassword: 5
  enablePasswordDigitsValidation: true

# Database configuration
spring:
  datasource:
    url: jdbc:postgresql://converium_db:5432/${DB_NAME}

# Disable TestUserRunner
test-user-runner:
  enabled: false
