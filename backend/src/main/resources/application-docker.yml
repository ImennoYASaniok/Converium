spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://converium_db:5432/studypals}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

test-user-runner:
  enabled: false